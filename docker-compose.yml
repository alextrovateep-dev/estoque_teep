services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teep
      POSTGRES_PASSWORD: teep
      POSTGRES_DB: estoque_teep
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teep -d estoque_teep"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://teep:teep@postgres:5432/estoque_teep?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: change-me-access-secret-min-32-chars!!
      JWT_REFRESH_SECRET: change-me-refresh-secret-min-32-chars!
      API_PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      NODE_ENV: development
      SEED_ON_START: "1"
      UPLOAD_DIR: /app/uploads
      SEED_ADMIN_EMAIL: admin@teep.com.br
      SEED_ADMIN_PASSWORD: Admin@123
    ports:
      - "4000:4000"
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  api_uploads:
