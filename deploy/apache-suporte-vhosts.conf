# Apache — VirtualHosts para TEEP Estoque (servidor suporte)
#
# Pré-requisitos:
# - DNS A: estoque.… e api.estoque.… → IP deste servidor
# - Stack Docker no ar (docker-compose.prod.yml + docker-compose.suporte.yml)
# - Módulos: sudo a2enmod proxy proxy_http proxy_wstunnel ssl headers rewrite
# - Certificados (certbot) nos mesmos nomes dos ServerName
#
# Ajuste ServerName / caminhos dos .pem conforme o domínio real.

# ---------- Web (Next.js) ----------
<VirtualHost *:80>
  ServerName estoque.teep.com.br
  RewriteEngine On
  RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
  ServerName estoque.teep.com.br

  SSLEngine on
  SSLCertificateFile /etc/letsencrypt/live/estoque.teep.com.br/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/estoque.teep.com.br/privkey.pem

  ProxyPreserveHost On
  RequestHeader set X-Forwarded-Proto "https"
  RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"

  ProxyPass / http://127.0.0.1:3000/
  ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>

# ---------- API (Express + Socket.io + uploads) ----------
<VirtualHost *:80>
  ServerName api.estoque.teep.com.br
  RewriteEngine On
  RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
  ServerName api.estoque.teep.com.br

  SSLEngine on
  SSLCertificateFile /etc/letsencrypt/live/api.estoque.teep.com.br/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/api.estoque.teep.com.br/privkey.pem

  ProxyPreserveHost On
  RequestHeader set X-Forwarded-Proto "https"
  RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"

  # WebSocket (notificações / assistente)
  ProxyPass /socket.io/ ws://127.0.0.1:4000/socket.io/
  ProxyPassReverse /socket.io/ ws://127.0.0.1:4000/socket.io/

  ProxyPass / http://127.0.0.1:4000/
  ProxyPassReverse / http://127.0.0.1:4000/
</VirtualHost>
