
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  USUARIOS {
    uuid id PK
    string nome
    string email
    string senha_hash
    string perfil
    boolean ativo
    timestamp criado_em
  }
  CATEGORIAS {
    uuid id PK
    string nome
    string descricao
    boolean ativo
  }
  PRODUTOS {
    uuid id PK
    string codigo
    string descricao
    uuid categoria_id FK
    string unidade
    decimal preco_unitario
    int estoque_minimo
    boolean ativo
  }
  CLIENTES {
    uuid id PK
    string nome
    string documento
    string tipo
    string email
    string telefone
    string cidade
    boolean ativo
  }
  ESTOQUES {
    uuid id PK
    uuid produto_id FK
    string filial
    decimal saldo_atual
    timestamp atualizado_em
  }
  TIPOS_MOVIMENTACAO {
    uuid id PK
    string nome
    string operacao
    string descricao
  }
  MOVIMENTACOES {
    uuid id PK
    uuid produto_id FK
    uuid tipo_id FK
    uuid usuario_id FK
    uuid cliente_id FK
    string filial
    decimal quantidade
    decimal preco_unitario
    string observacao
    timestamp data_movimento
  }

  CATEGORIAS ||--o{ PRODUTOS : "classifica"
  PRODUTOS ||--o{ ESTOQUES : "tem saldo em"
  PRODUTOS ||--o{ MOVIMENTACOES : "movimenta"
  TIPOS_MOVIMENTACAO ||--o{ MOVIMENTACOES : "classifica"
  USUARIOS ||--o{ MOVIMENTACOES : "registra"
  CLIENTES ||--o{ MOVIMENTACOES : "referenciado em"
`);
document.getElementById('erd').innerHTML = svg;
document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0],nums[2],nums[4],nums[6]];
  const ys = [nums[1],nums[3],nums[5],nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs)-x, h = Math.max(...ys)-y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
  rect.setAttribute('x',x); rect.setAttribute('y',y);
  rect.setAttribute('width',w); rect.setAttribute('height',h);
  rect.setAttribute('rx','8');
  for (const a of ['fill','stroke','stroke-width','class','style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a,firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke','none');
});
</script>
