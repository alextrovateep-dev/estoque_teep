# Produção / staging — use com .env.production
# Guia: docs/INSTALACAO.md
# Uso: ./scripts/compose-prod.sh up -d --build
#      export TEEP_SUORTE=1  # + docker-compose.suporte.yml (Apache)
#
# Não publica portas de Postgres/Redis. Caddy expõe 80/443 com HTTPS.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-estoque_teep}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teep} -d ${POSTGRES_DB:-estoque_teep}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - teep

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - teep

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # Secrets e SMTP: env_file passa valores literais (sem expandir $oi, $VAR…).
    # O bloco environment: abaixo só o que é montado ou default fixo.
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-teep}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-estoque_teep}?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      API_PORT: 4000
      TRUST_PROXY: "1"
      UPLOAD_DIR: /app/uploads
      PUPPETEER_EXECUTABLE_PATH: ${PUPPETEER_EXECUTABLE_PATH:-/usr/bin/chromium}
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - teep

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?defina NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?defina NEXT_PUBLIC_APP_URL}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - teep

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEB_HOST: ${WEB_HOST:-estoque.teep.com.br}
      API_HOST: ${API_HOST:-api.estoque.teep.com.br}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    networks:
      - teep

volumes:
  pgdata:
  redisdata:
  api_uploads:
  caddy_data:
  caddy_config:

networks:
  teep:
    driver: bridge
