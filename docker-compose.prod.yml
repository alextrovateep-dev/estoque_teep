# Produção / staging (F11) — use com .env.production
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Não publica portas de Postgres/Redis. Caddy expõe 80/443 com HTTPS.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-estoque_teep}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teep} -d ${POSTGRES_DB:-estoque_teep}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - teep

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - teep

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-teep}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-estoque_teep}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?defina JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?defina JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}
      API_PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:?defina CORS_ORIGIN}
      NODE_ENV: production
      TRUST_PROXY: "1"
      UPLOAD_DIR: /app/uploads
      SEED_ON_START: ${SEED_ON_START:-0}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@teep.com.br}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      FRONTEND_URL: ${CORS_ORIGIN}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-0}
      EMAIL_FROM_TRANSACTIONAL: ${EMAIL_FROM_TRANSACTIONAL:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      EMAIL_SUPPORT: ${EMAIL_SUPPORT:-}
      ASSISTENTE_LLM_ENABLED: ${ASSISTENTE_LLM_ENABLED:-0}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RMA_FILIAL_PREPARACAO_ID: ${RMA_FILIAL_PREPARACAO_ID:-}
      RMA_FILIAL_DESCARTE_ID: ${RMA_FILIAL_DESCARTE_ID:-}
      RMA_FILIAIS_ORIGEM_TROCA_IDS: ${RMA_FILIAIS_ORIGEM_TROCA_IDS:-}
      # PDF (Puppeteer) — imagem Alpine já define o default no Dockerfile
      PUPPETEER_EXECUTABLE_PATH: ${PUPPETEER_EXECUTABLE_PATH:-/usr/bin/chromium}
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - teep

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?defina NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?defina NEXT_PUBLIC_APP_URL}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - teep

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEB_HOST: ${WEB_HOST:-estoque.teep.com.br}
      API_HOST: ${API_HOST:-api.estoque.teep.com.br}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    networks:
      - teep

volumes:
  pgdata:
  redisdata:
  api_uploads:
  caddy_data:
  caddy_config:

networks:
  teep:
    driver: bridge
